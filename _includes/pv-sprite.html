{% comment %}
  Shared SVG sprite: the Pulsar mark (four petals around the pulsar core) and
  the arrow icons. Every page renders it once, ahead of the nav, so the nav and
  footer logos and the homepage petal art can all <use> the same shapes.
{% endcomment %}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- base petal: 100-unit box, its big rounded corner faces the core at bottom-right -->
    <path id="petal" d="M14 0H70A30 30 0 0 1 100 30V46A34 34 0 0 1 66 80H46A8 8 0 0 0 38 88V90A10 10 0 0 1 28 100H14A14 14 0 0 1 0 86V14A14 14 0 0 1 14 0Z"/>
    <symbol id="mark" viewBox="0 0 208 208">
      <use href="#petal" fill="#FF9314"/>
      <use href="#petal" fill="currentColor" transform="rotate(90 104 104)"/>
      <use href="#petal" fill="currentColor" transform="rotate(270 104 104)"/>
      <use href="#petal" fill="currentColor" transform="rotate(180 104 104)"/>
      <g transform="translate(104 104)">
        <g transform="rotate(12)" fill="none" stroke="var(--mk-dot,currentColor)" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="0 7.5"><circle cx="-20.5" r="20.5"/><circle cx="-14.5" r="14.5"/><circle cx="-8.5" r="8.5"/><circle cx="20.5" r="20.5"/><circle cx="14.5" r="14.5"/><circle cx="8.5" r="8.5"/></g>
        <g transform="rotate(19)" fill="#FF9314"><path d="M0 -8.9 L3.2 -33.6 A3.2 3.2 0 0 0 -3.2 -33.6 Z"/><path d="M0 8.9 L-3.2 33.6 A3.2 3.2 0 0 0 3.2 33.6 Z"/></g>
        <circle r="8" fill="var(--mk-bg,#fff)"/><circle r="5.6" fill="var(--mk-dot,currentColor)"/>
      </g>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  </defs>
</svg>
