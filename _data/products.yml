# Our own products, in homepage order.
#
#   tier    omit = featured in the carousel; `earlier` = listed under the
#           "Earlier builds" toggle below it (built and shipped, not our focus now)
#   status  live | early | dev   -> pill text "Live" / "Early access" / "In development"
#   url     omit for products with no public site; the card then has no button
#   thumb   screenshot under /assets/img/products/thumbs/ (800x500)
#   art     drawn thumbnail instead of a screenshot (bp, fc), styled in home.css
#   icon    app icon; `icon_fit: contain` for transparent logos that need padding
#   glyph   line icon drawn in place of an app icon (wrench, trend)


