<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Pulsar Ventures">
  <rect width="100" height="100" rx="24" fill="#ffffff"/>
  <!-- PV monogram, matching the site header lockup: P in orange over V in navy -->
  <text x="50" y="35" text-anchor="middle" dominant-baseline="central"
        font-family="Figtree, Inter, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="800" letter-spacing="-2" fill="#ff6b1a">P</text>
  <text x="50" y="70" text-anchor="middle" dominant-baseline="central"
        font-family="Figtree, Inter, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="800" letter-spacing="-2" fill="#0b2452">V</text>
</svg>
